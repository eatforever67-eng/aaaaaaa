<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Workspace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin: 0;
            position: absolute;
            width: 100%;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h2>Launch Unblocked Session</h2>
    <button onclick="launchProxy()">Launch Roblox</button>

    <script>
        function launchProxy() {
            // This encodes the now.gg link to hide it from your school's automated filter
            var gameUrl = "https://now.gg";
            
            // Routes the request through a public web proxy server
            var proxyUrl = "https://croxyproxy.com" + encodeURIComponent(gameUrl);
            
            window.open(proxyUrl, "_blank");
        }
    </script>
</body>
</html>
