<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Resource Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portal-container {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            border-top: 4px solid #0284c7;
        }

        .header-section {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 20px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .resource-card {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 16px;
            background-color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resource-title {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }

        .action-link {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .action-link:hover {
            background-color: #0369a1;
        }

        .diagnostic-log {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <main class="portal-container">
        <div class="header-section">
            <h1>External Workspace Router</h1>
            <p>Click the link below to access the external cloud environment. If the destination fails to load, the resource may be restricted by local network policies.</p>
        </div>

        <div class="resource-card">
            <span class="resource-title">Cloud Environment Portal</span>
            <!-- Explicit link configuration for predictable browser routing -->
            <a href="https://now.gg" class="action-link" target="_blank" rel="noopener noreferrer">Launch Resource</a>
        </div>

        <div class="diagnostic-log">
            <p id="network-status">Route Status: Initialized</p>
            <p id="timestamp">Load Signature: </p>
        </div>
    </main>

    <script>
        // Log page generation details to help diagnose load issues
        document.getElementById('timestamp').innerText = 'Load Signature: ' + new Date().toISOString();
        
        // Simple connectivity telemetry check
        if (navigator.onLine) {
            document.getElementById('network-status').innerText = 'Route Status: Local Connection Active';
        } else {
            document.getElementById('network-status').innerText = 'Route Status: Local Offline';
        }
    </script>
</body>
</html>
