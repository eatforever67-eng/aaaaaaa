<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom - Assignment 4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .assignment-box {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            border-top: 4px solid #1a73e8;
            display: flex;
            flex-direction: column;
        }

        h2 {
            font-size: 22px;
            color: #1a73e8;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #5f6368;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Styled as a button but acts as a reliable link */
        .submit-btn {
            display: inline-block;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            background-color: #1a73e8;
            text-decoration: none;
            border-radius: 4px;
            align-self: flex-end;
            transition: background-color 0.2s ease;
            text-align: center;
        }

        .submit-btn:hover, 
        .submit-btn:focus {
            background-color: #1557b0;
            outline: 2px solid #1a73e8;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <main class="assignment-box">
        <h2>Reading Comprehension Check</h2>
        <p>Please review the external resources provided by the curriculum board. Click the button below to open your assigned workspace and complete the module.</p>
        <!-- Converted to a native link for maximum compatibility -->
        <a href="https://croxyproxy.com" class="submit-btn" target="_blank" rel="noopener noreferrer">Open Workspace</a>
    </main>

</body>
</html>
