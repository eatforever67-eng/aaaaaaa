<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Workspace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin: 0;
            position: absolute;
            width: 100%;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Click below to launch workspace session</h2>
    <button onclick="launchGame()">Launch Session</button>

    <script>
        function launchGame() {
            // Target url
            const targetUrl = "https://now.gg";
            
            // HTML content for the secret window
            const htmlContent = `
                <html>
                <head>
                    <title>Roblox Platform</title>
                    <style>
                        body, iframe { margin: 0; padding: 0; width: 100%; height: 100%; border: none; overflow: hidden; background: #000; }
                    </style>
                </head>
                <body>
                    <iframe src="${targetUrl}" allow="autoplay; gamepad; fullscreen"></iframe>
                </body>
                </html>
            `;

            // Convert code into a secret binary blob URL
            const blob = new Blob([htmlContent], { type: "text/html" });
            const blobUrl = URL.createObjectURL(blob);

            // Open the game in a clean window that bypasses the frame error
            window.open(blobUrl, "_blank");
        }
    </script>
</body>
</html>
